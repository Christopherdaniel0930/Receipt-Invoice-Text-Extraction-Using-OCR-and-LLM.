[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-extractor"
version = "0.2.0"
description = "Simple receipt and invoice extraction using RapidOCR, Ollama/gpt-oss, Pydantic, and a trainable expense classifier"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pytest>=8.0",
    "rapidocr",
    "onnxruntime",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["app*"]
